<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d041c">
<title>Basketball Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Basketball arcade game"></canvas>

  <div id="ui">
    <button id="mute" type="button" aria-label="Toggle sound">SND ON</button>

    <section id="screen-start" class="screen">
      <div class="panel">
        <div class="tag">60 SECOND SHOOTOUT</div>
        <h1 class="title"><span>BASKETBALL</span><span>ARCADE</span></h1>
        <ol class="how">
          <li><b>1</b> DRAG a ball</li>
          <li><b>2</b> FLICK it up at the hoop</li>
          <li><b>3</b> 60 SECONDS &mdash; last 10 are <em>DOUBLE</em>!</li>
        </ol>
        <div class="hi">HIGH SCORE <b id="start-best">0</b></div>
        <button id="btn-start" class="arcade-btn" type="button"><span class="coin"></span>INSERT COIN</button>
        <div class="blink small">PRESS START</div>
      </div>
    </section>

    <section id="screen-count" class="screen hidden" aria-live="assertive">
      <div class="get-ready">GET READY</div>
      <div id="count-num">3</div>
    </section>

    <div id="banner" aria-live="polite"></div>

    <section id="screen-over" class="screen hidden">
      <div class="panel">
        <div class="tag" id="over-tag">BUZZER BEATER</div>
        <h2 class="over-title">TIME'S UP!</h2>
        <div class="final-label">FINAL SCORE</div>
        <div class="final" id="over-score">0</div>
        <div id="over-new" class="newbest hidden">&#9733; NEW HIGH SCORE &#9733;</div>
        <div class="hi">BEST <b id="over-best">0</b></div>
        <div class="stats">
          <div><b id="st-made">0</b><span>BASKETS</span></div>
          <div><b id="st-acc">0%</b><span>ACCURACY</span></div>
          <div><b id="st-streak">0</b><span>BEST STREAK</span></div>
        </div>
        <button id="btn-again" class="arcade-btn" type="button">PLAY AGAIN</button>
      </div>
    </section>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/physics.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
